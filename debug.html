<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Polaris Mobile Debug</title>
    <script>
      window.polarisDebugLog = [];
      window.polarisDebugErrors = [];

      window.onerror = function capturePolarisError(message, source, lineno, colno, error) {
        window.polarisDebugErrors.push({
          colno: colno,
          lineno: lineno,
          message: String(message),
          source: source || "",
          stack: error && error.stack ? String(error.stack) : "",
          type: "error",
        });
      };

      window.onunhandledrejection = function capturePolarisRejection(event) {
        var reason = event && event.reason;

        window.polarisDebugErrors.push({
          message: reason && reason.message ? String(reason.message) : String(reason),
          stack: reason && reason.stack ? String(reason.stack) : "",
          type: "unhandledrejection",
        });
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        background: #080b18;
        color: #f7f2e8;
        margin: 0;
        min-height: 100vh;
        padding: 20px;
      }

      main {
        display: grid;
        gap: 16px;
        margin: 0 auto;
        max-width: 720px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .debug-panel {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        display: grid;
        gap: 12px;
        padding: 16px;
      }

      .debug-grid {
        display: grid;
        gap: 8px;
      }

      .debug-row {
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr auto;
        min-height: 36px;
        padding: 8px 0;
      }

      .debug-state {
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 6px 10px;
        text-transform: uppercase;
      }

      .debug-state.ok {
        background: #b8f7d4;
        color: #052314;
      }

      .debug-state.fail {
        background: #ffb6b6;
        color: #350707;
      }

      .debug-state.wait {
        background: #ffe2a7;
        color: #2e1b00;
      }

      .debug-actions {
        display: grid;
        gap: 10px;
      }

      button {
        background: #f7d996;
        border: 0;
        border-radius: 8px;
        color: #130f08;
        font: inherit;
        font-weight: 800;
        min-height: 48px;
        padding: 12px 14px;
        touch-action: manipulation;
      }

      .scene {
        border: 1px dashed rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        padding: 12px;
      }

      .scene[hidden] {
        display: none;
      }

      .scene-benjamin.is-revealed {
        border-color: #f7d996;
      }

      pre {
        background: rgba(0, 0, 0, 0.32);
        border-radius: 8px;
        color: #d7e3ff;
        font-size: 0.8rem;
        margin: 0;
        max-height: 240px;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
      }
    </style>
    <script type="module" src="src/scripts/main.js?v=6"></script>
  </head>
  <body>
    <main>
      <section class="debug-panel" aria-labelledby="debug-title">
        <h1 id="debug-title">Polaris Mobile Debug</h1>
        <p>Diagnóstico temporal para iPhone, Brave, Safari y WebViews móviles.</p>
        <p class="transition-status" role="status" aria-live="polite" data-transition-status></p>
      </section>

      <section class="debug-panel" aria-labelledby="debug-status-title">
        <h2 id="debug-status-title">Estado</h2>
        <div class="debug-grid" data-debug-status-list></div>
      </section>

      <section class="debug-panel debug-actions" aria-labelledby="debug-actions-title">
        <h2 id="debug-actions-title">Pruebas táctiles</h2>
        <button type="button" data-start-journey onclick="window.startPolarisJourney && window.startPolarisJourney()">
          Iniciar viaje
        </button>
        <button type="button" data-debug-event-target>Probar click / pointerup / touchend</button>
        <button type="button" data-debug-show-benjamin>Ejecutar showScene("benjamin")</button>
      </section>

      <section class="debug-panel" aria-labelledby="debug-scenes-title">
        <h2 id="debug-scenes-title">Escenas mínimas</h2>
        <section class="scene scene-opening" data-scene="opening">
          <p>Escena 1: Opening visible</p>
        </section>
        <section class="scene scene-benjamin" data-scene="benjamin" hidden>
          <p>Escena 2: Benjamin visible</p>
        </section>
      </section>

      <section class="debug-panel" aria-labelledby="debug-errors-title">
        <h2 id="debug-errors-title">Errores capturados</h2>
        <pre data-debug-errors>Sin errores capturados.</pre>
      </section>
    </main>

    <script>
      (function initPolarisDebugPage() {
        var checks = {
          buttonDetected: false,
          clickWorks: false,
          mainLoaded: false,
          pointerupWorks: false,
          sceneManagerExists: false,
          showBenjaminWorks: false,
          startFunctionExists: false,
          touchendWorks: false,
        };

        var statusList = document.querySelector("[data-debug-status-list]");
        var eventTarget = document.querySelector("[data-debug-event-target]");
        var showBenjaminButton = document.querySelector("[data-debug-show-benjamin]");
        var errorsOutput = document.querySelector("[data-debug-errors]");

        function setCheck(key, value) {
          checks[key] = Boolean(value);
          render();
        }

        function getStatusLabel(key) {
          var labels = {
            buttonDetected: "Botón detectado",
            clickWorks: "Evento click funciona",
            mainLoaded: "main.js cargó",
            pointerupWorks: "Evento pointerup funciona",
            sceneManagerExists: "SceneManager existe",
            showBenjaminWorks: "showScene(\"benjamin\") funciona",
            startFunctionExists: "window.startPolarisJourney existe",
            touchendWorks: "Evento touchend funciona",
          };

          return labels[key] || key;
        }

        function render() {
          var html = Object.keys(checks)
            .map(function renderCheck(key) {
              var value = checks[key];
              var stateClass = value ? "ok" : "wait";
              var stateText = value ? "OK" : "PENDIENTE";

              return (
                '<div class="debug-row"><span>' +
                getStatusLabel(key) +
                '</span><span class="debug-state ' +
                stateClass +
                '">' +
                stateText +
                "</span></div>"
              );
            })
            .join("");

          statusList.innerHTML = html;

          if (window.polarisDebugErrors.length) {
            errorsOutput.textContent = JSON.stringify(window.polarisDebugErrors, null, 2);
          } else {
            errorsOutput.textContent = "Sin errores capturados.";
          }
        }

        function updateRuntimeStatus() {
          setCheck("buttonDetected", Boolean(document.querySelector("[data-start-journey]")));
          setCheck("mainLoaded", document.body.classList.contains("js-ready"));
          setCheck("startFunctionExists", typeof window.startPolarisJourney === "function");
          setCheck("sceneManagerExists", Boolean(window.PolarisEngine && window.PolarisEngine.sceneManager));
        }

        ["click", "pointerup", "touchend"].forEach(function registerEvent(eventName) {
          eventTarget.addEventListener(
            eventName,
            function handleDebugEvent(event) {
              event.preventDefault();
              setCheck(eventName + "Works", true);
            },
            { passive: false }
          );
        });

        showBenjaminButton.addEventListener("click", function handleShowBenjaminClick() {
          var sceneManager = window.PolarisEngine && window.PolarisEngine.sceneManager;

          if (!sceneManager || !sceneManager.showScene) {
            setCheck("showBenjaminWorks", false);
            return;
          }

          Promise.resolve(sceneManager.showScene("benjamin", { direction: "debug" }))
            .then(function handleResult(result) {
              var benjaminScene = document.querySelector("[data-scene='benjamin']");

              setCheck("showBenjaminWorks", Boolean(result) && !benjaminScene.hasAttribute("hidden"));
            })
            .catch(function handleError(error) {
              window.polarisDebugErrors.push({
                message: error && error.message ? String(error.message) : String(error),
                stack: error && error.stack ? String(error.stack) : "",
                type: "showScene",
              });
              setCheck("showBenjaminWorks", false);
              render();
            });
        });

        render();
        updateRuntimeStatus();
        window.setInterval(updateRuntimeStatus, 500);
        window.setInterval(render, 1000);
      })();
    </script>
  </body>
</html>
